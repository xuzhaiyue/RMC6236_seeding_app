name: histPharm R-CMD-check

on:
  pull_request:
    paths:
      - "histPharm/**"
      - ".github/workflows/histPharm-R-CMD-check.yaml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "histPharm/**"
      - ".github/workflows/histPharm-R-CMD-check.yaml"
  workflow_dispatch:

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: histPharm
          extra-packages: any::rcmdcheck
          needs: check
      - name: Check histPharm
        run: rcmdcheck::rcmdcheck("histPharm", args = c("--no-manual", "--as-cran"), error_on = "warning")
        shell: Rscript {0}
